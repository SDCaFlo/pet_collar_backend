[project]
name = "broker-api"
version = "0.1.0"
description = ""
authors = [
    {name = "SCDaFlo",email = "scastrof.94@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)"
]

[tool.poetry]
packages = [{include = "broker_api", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
